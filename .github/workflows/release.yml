name: Release agent

# Déclenché par un tag "v1.2.3" : construit une archive source unique
# (le même code tourne sur Windows/Linux/macOS) et publie une GitHub
# Release avec l'archive + son empreinte sha256, utilisées par le
# mécanisme d'auto-update de l'agent (src/core/updater.js).
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Vérifier la cohérence tag / package.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Le tag ($GITHUB_REF_NAME) ne correspond pas à la version de package.json ($PKG_VERSION)"
            exit 1
          fi
          echo "VERSION=$TAG_VERSION" >> "$GITHUB_ENV"

      - name: Installer les dépendances (validation)
        run: npm install --omit=optional --no-audit --no-fund

      - name: Construire l'archive source
        run: |
          ARCHIVE_NAME="haccp-agent-v${VERSION}.tar.gz"
          STAGE_DIR="build/haccp-agent"
          mkdir -p "$STAGE_DIR"
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='node_modules' \
            --exclude='build' --exclude='agent-config.json' --exclude='data' \
            --exclude='versions' --exclude='*.log' \
            ./ "$STAGE_DIR"/
          tar -czf "$ARCHIVE_NAME" -C build haccp-agent
          sha256sum "$ARCHIVE_NAME" > checksums.txt
          cat checksums.txt

      - name: Publier la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: "Agent HACCP v${{ env.VERSION }}"
          generate_release_notes: true
          files: |
            haccp-agent-v${{ env.VERSION }}.tar.gz
            checksums.txt
